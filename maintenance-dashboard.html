<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maintenance Dashboard</title>
  <link rel="stylesheet" href="css/maintenance-dashboard.css" />
</head>
<body>
  <button id="menuToggle" class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <aside class="side-menu" aria-label="Maintenance menu">
    <div class="side-menu-inner">
      <div class="side-user" title="Signed-in user">
        <span id="sideUserInitial" class="user-icon" aria-hidden="true">M</span>
        <span class="side-user-details">
          <span id="sideUserName" class="side-label">Loading user...</span>
          <span id="sideUserEmail" class="side-email">Maintenance</span>
        </span>
      </div>

      <a href="maintenance-search.html" class="side-link">
        <img src="images/search.png" alt="" class="nav-icon" aria-hidden="true" />
        <span class="side-label">Search</span>
      </a>

      <nav class="side-nav" aria-label="Ticket status filters">
        <button class="chip active" data-status="OPEN" type="button">
          <img src="images/open.png" alt="" class="status-dot" aria-hidden="true" />
          <span class="chip-label">Open</span>
          <span class="chip-count" id="count-OPEN">0</span>
        </button>

        <button class="chip" data-status="IN_PROGRESS" type="button">
          <img src="images/in-progress.png" alt="" class="status-dot" aria-hidden="true" />
          <span class="chip-label">In Progress</span>
          <span class="chip-count" id="count-IN_PROGRESS">0</span>
        </button>

        <button class="chip" data-status="WAITING_SPARE_PARTS" type="button">
          <img src="images/waiting-spare-parts.png" alt="" class="status-dot" aria-hidden="true" />
          <span class="chip-label">Waiting Spare Parts</span>
          <span class="chip-count" id="count-WAITING_SPARE_PARTS">0</span>
        </button>

        <button class="chip" data-status="RESOLVED" type="button">
          <img src="images/resolved.png" alt="" class="status-dot" aria-hidden="true" />
          <span class="chip-label">Resolved</span>
          <span class="chip-count" id="count-RESOLVED">0</span>
        </button>

        <button class="chip" data-status="CLOSED" type="button">
          <img src="images/closed.png" alt="" class="status-dot" aria-hidden="true" />
          <span class="chip-label">Closed</span>
          <span class="chip-count" id="count-CLOSED">0</span>
        </button>
      </nav>

      <button id="logoutBtn" class="side-logout" type="button">
        <img src="images/exit-button.png" alt="" class="logout-icon" aria-hidden="true" />
        <span class="side-label">Log Out</span>
      </button>
    </div>
  </aside>
  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

  <div class="page">
    <header class="topbar">
      <div>
        <h1>Maintenance Dashboard</h1>
      </div>
    </header>

    <div id="alert" class="alert"></div>

    <div class="filter-row">
      <div class="filter-group">
        <label for="filterDate">Filter by Date</label>
        <input type="date" id="filterDate" />
      </div>

      <div class="filter-actions">
        <button id="clearFiltersBtn" class="btn btn-secondary" type="button">Clear Filters</button>
      </div>
    </div>

    <section id="ticketList" class="ticket-list">
      <div class="empty">Loading tickets...</div>
    </section>
  </div>

  <!-- Update modal -->
  <div id="updateModal" class="modal hidden">
    <div class="modal-card">
        <div class="modal-inner">
          <div class="modal-head">
          <h2>Update Ticket</h2>
          <button id="closeModalBtn" class="icon-btn" type="button">✕</button>
        </div>

        <div class="ticket-summary">
          <div><b>Ticket ID</b><span id="modalTicketId">-</span></div>
          <div><b>Machine</b><span id="modalMachine">-</span></div>
          <div><b>Location</b><span id="modalLocation">-</span></div>
        </div>

        <div class="row">
          <label>Ticket History</label>
          <div class="timeline" id="ticketTimeline"></div>
        </div>

        <form id="updateForm" novalidate>
          <div class="row">
            <label for="updateStatus">Status</label>
            <select id="updateStatus">
              <option value="OPEN">Open</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="WAITING_SPARE_PARTS">Waiting Spare Parts</option>
              <option value="RESOLVED">Resolved</option>
              <option value="CLOSED">Closed</option>
            </select>
          </div>

          <div class="row">
            <label for="actionTaken">Action Taken</label>
            <textarea id="actionTaken" maxlength="500" placeholder="Describe what was checked, repaired, or required..."></textarea>
            <div class="help"><span id="actionCount">0</span>/500 characters</div>
          </div>

          <div class="row">
            <label for="evidencePhotos">Evidence Photos</label>
            <input id="evidencePhotos" type="file" accept="image/*" />
            <div class="help">Only 1 photo required</div>
            <div id="selectedPhotoList" class="selected-photo-list"></div>
          </div>

          <div class="modal-actions">
            <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
            <button type="submit" id="saveUpdateBtn" class="btn">Save Update</button>
          </div>
        </form>
      </div>
      
    </div>
  </div>

    <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="loadingText">Loading...</p>
    </div>
  </div>

  <div id="imagePreviewModal" class="image-preview-modal hidden">
    <button id="closeImagePreview" class="image-preview-close">×</button>
    <img id="previewLargeImage" src="" alt="Preview image" />
  </div>

  <script type="module" src="js/maintenance-dashboard.js"></script>
</body>
</html>
